<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0c">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0c0d0c;--surface:#151715;--line:#2b2f2b;--fg:#f4f5f2;--muted:#a3a89f;--dim:#6c7168;--red:#e0392a;--orange:#f0a43c;--green:#5ccc45;--tri:linear-gradient(90deg,var(--green),var(--orange),var(--red));--display:"Bebas Neue","Oswald",Impact,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-text-size-adjust:100%}
a{color:var(--orange)}
a:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px max(16px,env(safe-area-inset-left)) 18px max(16px,env(safe-area-inset-right));border-bottom:1px solid var(--line);position:relative}
.top::after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:3px;background:var(--tri)}
.top img{height:34px;width:auto;display:block}
.top .back{color:var(--fg);text-decoration:none;font-weight:600;font-size:14px;border:1px solid var(--line);padding:9px 14px;border-radius:999px}
.top .back:hover{border-color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:48px 16px 96px}
h1{font-family:var(--display);font-weight:400;letter-spacing:.03em;font-size:clamp(44px,9vw,72px);line-height:.95;margin:0 0 12px}
h2{font-family:var(--display);font-weight:400;letter-spacing:.04em;font-size:28px;margin:40px 0 8px}
p,li{color:var(--muted);line-height:1.7;font-size:16px}
strong{color:var(--fg);font-weight:600}
ul{padding-left:20px}
.meta{color:var(--dim);font-size:14px}
footer{border-top:1px solid var(--line);padding:28px 16px 48px;text-align:center;color:var(--dim);font-size:13px}
@media (min-width:900px){.top{padding-inline:48px}}
</style>
<title>Page not found · Maligant Group</title>
<meta name="robots" content="noindex">
<style>
.nf{min-height:calc(100svh - 72px);display:grid;place-items:center;text-align:center;padding:48px 16px}
.nf .code{font-family:var(--display);font-size:clamp(120px,32vw,240px);line-height:.85;background:var(--tri);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.nf h1{font-size:clamp(34px,7vw,52px);margin:8px 0 6px}
.nf p{margin:0 auto 28px;max-width:440px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:999px;font-size:15px}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:#c92f21}
.btn.ghost{color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <a href="/" aria-label="Maligant Group home"><img src="/thumbs/maligant-logo.png" alt="Maligant Group · Thinking made visual"></a>
</header>
<main class="nf" style="max-width:none">
  <div>
    <p class="code" aria-hidden="true">404</p>
    <h1>This scene didn't make the cut</h1>
    <p>The page you're looking for isn't here. The shows, flyers and DJ screens are all one click away.</p>
    <div class="btns">
      <a class="btn primary" href="/">Watch the work</a>
      <a class="btn ghost" href="/#contact">Book a shoot</a>
    </div>
  </div>
</main>
</body>
</html>
